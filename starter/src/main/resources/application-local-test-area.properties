# Local process for the registered business TEST area. This profile has no
# credentials or remote defaults: operators provide a least-privilege account
# explicitly and the process must not create or alter shared schema.
server.address=127.0.0.1
server.port=10019

spring.datasource.db-url=${CYF_SHARED_DATABASE_URL}
spring.datasource.url=${CYF_SHARED_DATABASE_URL}
spring.datasource.username=${CYF_LOCAL_DATABASE_USER}
spring.datasource.password=${CYF_LOCAL_DATABASE_PASSWORD}
spring.sql.init.mode=never

cyf.deployment.id=local-api-a
cyf.deployment.stage=LOCAL_TEST
cyf.deployment.registration-credential=${CYF_LOCAL_REGISTRATION_CREDENTIAL}
# The local TEST process exposes only the transaction-guarded conversation slice.
cyf.deployment.allowed-modules[0]=conversation
cyf.deployment.allow-no-business-modules=false
cyf.tenant.allowed-tenants[0]=1
cyf.tenant.require-bound-identity=true
# The local business API consumes central tokens; it must not issue local OAuth codes/tokens.
cyf.oauth.authorization-server.enabled=false
cyf.worker.allowed-tenants[0]=1
cyf.worker.data-domain-id=cyf
cyf.worker.execution-pool=local-experiment-a
# Verify centrally signed tokens against the central public JWK endpoint.
# Both variables are mandatory: a local process must not trust its ephemeral key.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${CYF_OAUTH_ISSUER}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${CYF_OAUTH_JWKS_URI}

cyf.schema.mode=validate

# Do not inherit a production external-action path merely because this process
# happens to use the shared business database.
economy.preview.enabled=false
economy.preview.test-issuance-enabled=false
economy.hosting-rent.schema-enabled=false
economy.skill.schema.enabled=false
chat.agent.tools.enabled=false
economy.skill.marketplace.enabled=false
economy.skill.seed.enabled=false
agent.personal-workspace-storage.enabled=false
agent.command-outbox.enabled=false
jia.agent.formal-delivery.enabled=false
wx.daily-vote.schema.install-on-startup=false
archive.reader.enabled=false
user.permit.refresh.enable=false
jia.chat.service.stdio.enable=false
archive.question.enabled=false
agent.task-events.enabled=false
agent.rabbit-topology.enabled=false
agent.rabbit-publish.enabled=false
agent.rabbit-consume.enabled=false
agent.rabbit-dispatch.enabled=false
agent.rabbit-operations.read-enabled=false
agent.rabbit-operations.redrive-enabled=false
agent.rabbit-operations.reissue-enabled=false
# Disable unrelated Rabbit listeners and health probes in this local business slice.
spring.rabbitmq.listener.type=simple
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
management.health.rabbit.enabled=false
management.health.elasticsearch.enabled=false
management.health.ldap.enabled=false
# Scene streams currently use legacy tenant/client gates and remain unavailable locally.
juyiting.scene-state.enabled=false
juyiting.scene-events.enabled=false
# Legacy Agent WebSocket API keys have no authoritative region/pool registration yet;
# the local test-area process cannot open a channel to tenant-zero agents.
jia.chat.service.websocket.enable=false
jia.chat.voice.enabled=false
chat.memory.aggregate.enabled=false
chat.memory.retention-cleanup.enabled=false
