# Local process for the registered business TEST area. This profile has no
# credentials or remote defaults: operators provide a least-privilege account
# explicitly and the process must not create or alter shared schema.
server.address=127.0.0.1
server.port=10019
server.ssl.enabled=false

spring.datasource.db-url=${CYF_SHARED_DATABASE_URL}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=${CYF_SHARED_DATABASE_URL}
spring.datasource.username=${CYF_LOCAL_DATABASE_USER}
spring.datasource.password=${CYF_LOCAL_DATABASE_PASSWORD}
spring.sql.init.mode=never

cyf.deployment.id=local-api-a
cyf.deployment.stage=LOCAL_TEST
cyf.deployment.registration-credential=${CYF_LOCAL_REGISTRATION_CREDENTIAL}
# The local TEST process exposes only the transaction-guarded conversation slice.
cyf.deployment.allowed-modules[0]=conversation
cyf.deployment.allow-no-business-modules=false
cyf.tenant.admission-mode=fixed-tenant
cyf.tenant.fixed-tenant-id=1
cyf.tenant.fixed-client-tenants.cyf-local=1
