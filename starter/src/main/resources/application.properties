# Product voice uses the bounded safe adapter; native Spring AI audio models are prohibited.
spring.ai.model.audio.transcription=none
spring.ai.model.audio.speech=none
server.forward-headers-strategy=framework
# HTTP server SLO histogram: normalized Spring Boot uri tags only; excess routes collapse to uri=OVERFLOW.
# The enabled feature supplies a 1024-tag fallback only when Boot's authoritative cap is not configured.
jia.metrics.http.enabled=true
# Existing Boot observation emits no new servlet timing filter. Low-cardinality slow counters reuse http.request.log.slow-threshold-ms; deadline counters reuse the shadow deadline context.
