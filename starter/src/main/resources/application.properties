# Product voice uses the bounded safe adapter; native Spring AI audio models are prohibited.
spring.ai.model.audio.transcription=none
spring.ai.model.audio.speech=none
server.forward-headers-strategy=framework
# HTTP server SLO histogram: normalized Spring Boot uri tags only; exporter p95/p99 histogram is enabled and overflow is retained as uri=OVERFLOW, never dropped.
# Keep Boot's deny cap aligned so this high-precedence filter maps the final bounded value to OVERFLOW first.
jia.metrics.http.enabled=true
jia.metrics.http.max-uri-tags=1024
management.metrics.web.server.max-uri-tags=1024
