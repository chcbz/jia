# Central authorization deployment. Activation requires reviewed tenant grants,
# OAuth authorization schema and an operator-managed signing key; this profile
# must not be enabled independently of the complete tenant cutover.
cyf.oauth.authorization-server.enabled=true
cyf.oauth.signing.enabled=true
cyf.oauth.signing.issuer=${CYF_OAUTH_ISSUER}
cyf.oauth.signing.private-jwk-path=${CYF_OAUTH_PRIVATE_JWK_PATH}

# Only audited registered business areas; no implicit tenant 0 or 1 access.
cyf.tenant.require-bound-identity=true
cyf.tenant.allowed-tenants=${CYF_CENTRAL_ALLOWED_TENANTS}

# The same issuer and public JWKS are also used by central business routes.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${CYF_OAUTH_ISSUER}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${CYF_OAUTH_JWKS_URI}
