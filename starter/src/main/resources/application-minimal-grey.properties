# Minimal fixed-tenant candidate. Secrets are supplied only by the launcher environment.
server.address=127.0.0.1
server.port=${SERVER_PORT:10029}
server.ssl.enabled=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${CYF_SHARED_DATABASE_URL}
spring.datasource.username=${CYF_LOCAL_DATABASE_USER}
spring.datasource.password=${CYF_LOCAL_DATABASE_PASSWORD}
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none
spring.data.redis.host=127.0.0.1
spring.data.redis.port=${CYF_LOCAL_REDIS_PORT:16479}
spring.data.redis.password=${CYF_LOCAL_REDIS_PASSWORD:}
spring.data.redis.database=0
spring.security.oauth2.authorizationserver.issuer=${CYF_LOCAL_API_ORIGIN:http://127.0.0.1:10029}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${CYF_LOCAL_API_ORIGIN:http://127.0.0.1:10029}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${CYF_LOCAL_API_ORIGIN:http://127.0.0.1:10029}/oauth2/jwks
cyf.security.legacy-single-tenant-id=0
cyf.security.fixed-tenant.enabled=true
cyf.security.fixed-tenant.tenant-id=1
cyf.security.fixed-tenant.client-id=cyf-local
cyf.security.oauth.issuer-client-ids=cyf-local
spring.task.scheduling.enabled=false
# This relay owns its executor; the global scheduling flag does not disable it.
chat.bounty-bootstrap.enabled=false
spring.ai.mcp.client.enabled=false
spring.ai.mcp.client.toolcallback.enabled=false
spring.ai.vectorstore.redis.initialize-schema=false
spring.ai.vectorstore.elasticsearch.initialize-schema=false
cyf.chat.deliberation-schema.allow-additive-migration=false
cyf.chat.typed-deliberation-schema.allow-additive-migration=false
cyf.chat.delivery-review-schema.allow-additive-migration=false
agent.task-events.enabled=false
agent.command-outbox.enabled=false
agent.rabbit-topology.enabled=false
agent.rabbit-publish.enabled=false
agent.rabbit-consume.enabled=false
agent.rabbit-dispatch.enabled=false
agent.rabbit-operations.read-enabled=false
agent.rabbit-operations.redrive-enabled=false
agent.rabbit-operations.reissue-enabled=false
# File CRUD is tenant-scoped; opt in with an explicit size policy and private root.
# Existing minimal launchers remain compatible when these new settings are absent.
agent.personal-workspace-storage.enabled=${CYF_LOCAL_WORKSPACE_ENABLED:false}
agent.personal-workspace-storage.root-directory=${CYF_LOCAL_STATE_ROOT:/tmp/cyf-gray-minimal}/personal-workspace
# Reuse the operator's existing workspace size policy, do not invent a new limit.
agent.personal-workspace-storage.max-content-bytes=${CYF_LOCAL_WORKSPACE_MAX_CONTENT_BYTES:0}
agent.controlled-image-provider.enabled=false
agent.controlled-image-provider.bridge-enabled=false
economy.preview.enabled=false
economy.skill.marketplace.enabled=false
jia.agent.formal-delivery.enabled=false
jia.agent.selected-output-finalization.enabled=false
chat.delivery-review.enabled=false
chat.conversation-archive.enabled=false
chat.selected-output-finalization.enabled=false
jia.chat.voice.enabled=false
logging.file.name=${CYF_LOCAL_STATE_ROOT:/tmp/cyf-gray-minimal}/api.log
jia.file.path=${CYF_LOCAL_STATE_ROOT:/tmp/cyf-gray-minimal}/files
mat.web.realpath=${CYF_LOCAL_STATE_ROOT:/tmp/cyf-gray-minimal}/material
cyf.startup.schema-writes-enabled=false
archive.reader.enabled=false
archive.question.enabled=false
# Never auto-declare or consume shared RabbitMQ resources in the grey process.
spring.rabbitmq.dynamic=false
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
management.health.rabbit.enabled=false
