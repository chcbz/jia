import org.gradle.api.GradleException
import org.gradle.api.tasks.testing.Test

plugins {
    id 'org.springframework.boot' version '4.0.1'
}

def isForbiddenPublicBootJarMember = rootProject.ext.isForbiddenPublicArtifactJarMember

sourceSets {
    publicArtifactVerifier {
        java.srcDir 'src/publicArtifactVerifier/java'
        resources.setSrcDirs([])
    }
    publicArtifactVerifierTest {
        java.srcDir 'src/publicArtifactVerifierTest/java'
        resources.setSrcDirs([])
        compileClasspath += sourceSets.publicArtifactVerifier.output
        runtimeClasspath += sourceSets.publicArtifactVerifier.output
    }
}

dependencies {
    api project(':common:jia-common-starter')
    api project(':base:jia-base-starter')
    api project(':dwz:jia-dwz-starter')
    api project(':isp:jia-isp-starter')
    api project(':material:jia-material-starter')
    api project(':oauth:jia-oauth-client-starter')
    api project(':oauth:jia-oauth-resource-starter')
    api project(':oauth:jia-oauth-server-starter')
    api project(':sms:jia-sms-starter')
    api project(':task:jia-task-starter')
    api project(':user:jia-user-starter')
    api project(':workflow:jia-workflow-starter')
    api project(':chat:jia-chat-starter')

    api project(':agent:jia-agent-service')
    api project(':agent:jia-agent-mapper')
    api project(':kefu:jia-kefu-service')
    api project(':kefu:jia-kefu-mapper')
    api project(':point:jia-point-service')
    api project(':point:jia-point-mapper')
    api project(':wx:jia-wx-service')
    api project(':wx:jia-wx-mapper')

    implementation(libs.spring.boot.starter.redisson)
    implementation(libs.spring.boot.starter.thymeleaf)
    implementation(libs.spring.boot.starter.data.redis)
    implementation(libs.spring.boot.starter.data.ldap)
    implementation(libs.spring.boot.starter.cache)
    implementation(libs.spring.boot.starter.security)
    implementation(libs.spring.security.oauth2.authorization.server)
    implementation(libs.spring.boot.starter.oauth2.resource.server)
    implementation(libs.spring.boot.starter.oauth2.client)
    implementation(libs.spring.boot.starter.elasticsearch)
    implementation(libs.spring.boot.starter.amqp)
    implementation(libs.spring.boot.starter.actuator)
    implementation(libs.spring.boot.starter.websocket)
    implementation(libs.spring.ai.starter.model.deepseek)
    implementation("org.springframework.ai:spring-ai-starter-model-openai:${libs.versions.spring.ai.asProvider().get()}")
    implementation(libs.camunda)
    implementation(libs.jodd)

    testImplementation project(':common:jia-common-test')
    testImplementation(libs.spring.boot.starter.test)
    testImplementation(libs.junit.jupiter)
    testAnnotationProcessor libs.lombok
    testCompileOnly libs.lombok

    publicArtifactVerifierTestImplementation(libs.junit.jupiter)
    publicArtifactVerifierTestRuntimeOnly(libs.junit.platform.launcher)
}

version = '1.1.2-SNAPSHOT'
description = 'starter'

jar {
    enabled = false
}

def publicArtifactVerifierTests = tasks.register('publicArtifactVerifierTest', Test) {
    group = 'verification'
    description = 'Runs isolated mutation tests for the dependency-free public artifact verifier.'
    testClassesDirs = sourceSets.publicArtifactVerifierTest.output.classesDirs
    classpath = sourceSets.publicArtifactVerifierTest.runtimeClasspath
    useJUnitPlatform()
}

tasks.register('publicBootJarSecurityPolicyTest') {
    group = 'verification'
    description = 'Compatibility lifecycle alias for the isolated public artifact verifier tests.'
    dependsOn publicArtifactVerifierTests
}

tasks.named('check') {
    dependsOn publicArtifactVerifierTests
}

bootJar {
    mainClass = 'cn.jia.JiaApplication'
    manifest {
        attributes 'Start-Class': 'cn.jia.JiaApplication'
    }
    exclude { details -> isForbiddenPublicBootJarMember(details.path) }
    dependsOn publicArtifactVerifierTests
    dependsOn tasks.named(sourceSets.publicArtifactVerifier.classesTaskName)
    doLast {
        def captured = new ByteArrayOutputStream()
        int exitValue
        try {
            exitValue = providers.javaexec {
                classpath = sourceSets.publicArtifactVerifier.runtimeClasspath
                mainClass = 'cn.jia.build.security.PublicArtifactVerifier'
                args archiveFile.get().asFile.absolutePath,
                        new File(temporaryDir, 'public-artifact-verifier-root').absolutePath
                standardOutput = captured
                errorOutput = captured
                ignoreExitValue = true
            }.result.get().exitValue
        } catch (Exception ignored) {
            throw new GradleException('Public bootJar security policy violations:\n - <public-artifact-verifier-error>')
        }
        if (exitValue != 0) {
            def fixedTokens = [
                    '<nested-zip-eocd-error>',
                    '<nested-zip-central-directory-error>',
                    '<nested-zip-local-header-error>',
                    '<nested-zip-data-descriptor-error>',
                    '<nested-zip-occurrence-mismatch>',
                    '<nested-zip-payload-integrity-error>',
                    '<nested-zip-unsupported>',
                    '<nested-zip-limit-error>',
                    '<configuration-parse-error>',
                    '<nested-temp-security-error>',
                    '<nested-temp-cleanup-error>',
                    '<public-artifact-verifier-error>'
            ] as Set
            def outputLines = captured.toString('UTF-8').readLines().findAll { !it.empty }
            def diagnostics = outputLines.findAll { line ->
                def tokenSeparator = line.lastIndexOf(': ')
                if (tokenSeparator >= 0 && fixedTokens.contains(line.substring(tokenSeparator + 2))) {
                    return line.substring(0, tokenSeparator) ==~ /(?:<public-bootjar>|<nested-temp>|[-A-Za-z0-9_./!]+)/
                }
                line == '<public-artifact-verifier-error>' ||
                        line ==~ /[-A-Za-z0-9_./!]+/ ||
                        line ==~ /[-A-Za-z0-9_./!]+: [-A-Za-z0-9_.]*api-key[-A-Za-z0-9_.]*/
            }
            if (diagnostics.empty || diagnostics.size() != outputLines.size()) {
                diagnostics = ['<public-artifact-verifier-error>']
            }
            throw new GradleException('Public bootJar security policy violations:\n - ' +
                    diagnostics.join('\n - '))
        }
    }
}
