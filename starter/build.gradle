version = '1.1.2-SNAPSHOT'
description = 'starter'

jar {
    enabled = false
}

bootJar {
    mainClass = 'cn.jia.JiaApplication'
    manifest {
        attributes 'Start-Class': 'cn.jia.JiaApplication'
    }
    exclude { details -> isForbiddenPublicBootJarMember(details.path) }
    doLast {
        def violations = publicBootJarSecurityViolations(
                archiveFile.get().asFile,
                new File(temporaryDir, 'security-scan'))
        if (!violations.empty) {
            throw new GradleException('Public bootJar security policy violations:\n - ' +
                    violations.join('\n - '))
        }
    }
}

tasks.register('publicBootJarSecurityPolicyTest') {
    group = 'verification'
    description = 'Runs offline adversarial tests for the public bootJar sensitive-material policy.'

    doLast {
        project.delete(temporaryDir)
        temporaryDir.mkdirs()
        def securityTemporaryDirectory = new File(temporaryDir, 'security-scan')

        def safeArchive = new File(temporaryDir, 'safe.jar')
        writePublicBootJarPolicyFixture(safeArchive, [
                'BOOT-INF/classes/application-prod.properties': '''spring.ai.enc.api-key=ENC(ciphertext)
spring.ai.external.api-key=${PUBLIC_API_KEY}
spring.ai.dummy.api-key=test-only-dummy-provider-api-key
spring.ai.empty.api-key=
''',
                'BOOT-INF/classes/application-prod.yaml':
                        'providers: [{ "api' + '\\' +
                        'u002dkey": "${PUBLIC_API_KEY}" }] # safe fixture\n'
        ])
        def safeViolations = publicBootJarSecurityViolations(safeArchive, securityTemporaryDirectory)
        if (!safeViolations.empty) {
            throw new GradleException('Public bootJar security policy rejected the safe fixture:\n - ' +
                    safeViolations.join('\n - '))
        }

        def forbiddenArchive = new File(temporaryDir, 'forbidden-members.jar')
        def forbiddenMembers = [
                'BOOT-INF/classes/application-dev.properties',
                'BOOT-INF/classes/application-dev.yml',
                'BOOT-INF/classes/application-dev.yaml',
                'BOOT-INF/classes/localhost_ssl_cert.p12',
                'BOOT-INF/classes/wxpay_apiclient_cert.p12',
                'BOOT-INF/classes/client.PFX',
                'BOOT-INF/classes/client.jks',
                'BOOT-INF/classes/client.keystore',
                'BOOT-INF/classes/client.pem',
                'BOOT-INF/classes/client.key'
        ]
        writePublicBootJarPolicyFixture(forbiddenArchive,
                forbiddenMembers.collectEntries { [(it): 'fixture'] })
        def forbiddenViolations = publicBootJarSecurityViolations(forbiddenArchive, securityTemporaryDirectory)
        forbiddenMembers.each { memberName ->
            if (!forbiddenViolations.contains(memberName)) {
                throw new GradleException("Public bootJar security policy missed member: ${memberName}")
            }
        }

        def unsafeArchive = new File(temporaryDir, 'unsafe-properties.jar')
        writePublicBootJarPolicyFixture(unsafeArchive, [
                'BOOT-INF/classes/application-prod.properties':
                        'spring.ai.duplicate.api-key=adversarial-secret-canary\n' +
                        'spring.ai.duplicate.api-key=${PUBLIC_API_KEY}\n' +
                        'spring.ai.escaped.api\\-key=adversarial-secret-canary\n' +
                        'spring.ai.continued.api-key=adversarial-\\\n secret-canary\n' +
                        'spring.ai.defaulted.api-key=${PUBLIC_API_KEY:embedded-value}\n'
        ])
        def unsafeViolations = publicBootJarSecurityViolations(unsafeArchive, securityTemporaryDirectory)
        [
                'spring.ai.duplicate.api-key',
                'spring.ai.escaped.api-key',
                'spring.ai.continued.api-key',
                'spring.ai.defaulted.api-key'
        ].each { propertyName ->
            if (!unsafeViolations.contains("BOOT-INF/classes/application-prod.properties: ${propertyName}")) {
                throw new GradleException("Public bootJar security policy missed property: ${propertyName}")
            }
        }
        if (unsafeViolations.any {
            it.contains('adversarial-secret-canary') || it.contains('embedded-value')
        }) {
            throw new GradleException('Public bootJar security policy exposed a property value in diagnostics')
        }

        def nestedUnsafeJar = new File(temporaryDir, 'nested-unsafe.jar')
        writePublicBootJarPolicyFixture(nestedUnsafeJar, [
                'application-dev.properties': 'fixture=true\n',
                'certificates/client.p12': 'synthetic-pkcs12-fixture',
                'config/application-prod.yaml': 'provider:\n  api-key: adversarial-secret-canary\n',
                'config/application-flow.yml':
                        '---\nproviders: [{ "api\\x2dkey": adversarial-secret-canary }]\n...\n',
                'config/application-escaped.yaml':
                        '"api' + '\\' + 'u002dkey": "adversarial#secret-canary" # quote-aware comment\n',
                'config/application-sequence.yaml':
                        '---\nproviders:\n  - { "api' + '\\' +
                        'U0000002dkey": adversarial-secret-canary }\n...\n',
                'config/application-compact-sequence.yml':
                        'providers: ["api-key": adversarial-secret-canary]\n',
                'config/application-single-quoted.yml':
                        "provider: { 'api-key': adversarial-secret-canary }\n"
        ])
        def nestedContainerArchive = new File(temporaryDir, 'nested-container.jar')
        def nestedLibraryMember = 'BOOT-INF/lib/adversarial-first-party.jar'
        writePublicBootJarPolicyFixture(nestedContainerArchive, [
                (nestedLibraryMember): nestedUnsafeJar.bytes
        ])
        def nestedViolations = publicBootJarSecurityViolations(
                nestedContainerArchive,
                securityTemporaryDirectory)
        [
                "${nestedLibraryMember}!application-dev.properties",
                "${nestedLibraryMember}!certificates/client.p12",
                "${nestedLibraryMember}!config/application-prod.yaml: api-key",
                "${nestedLibraryMember}!config/application-flow.yml: api-key",
                "${nestedLibraryMember}!config/application-escaped.yaml: api-key",
                "${nestedLibraryMember}!config/application-sequence.yaml: api-key",
                "${nestedLibraryMember}!config/application-compact-sequence.yml: api-key",
                "${nestedLibraryMember}!config/application-single-quoted.yml: api-key"
        ].each { violation ->
            if (!nestedViolations.contains(violation)) {
                throw new GradleException("Public bootJar security policy missed nested classification: ${violation}")
            }
        }
        if (nestedViolations.any { it.contains('adversarial-secret-canary') }) {
            throw new GradleException('Public bootJar security policy exposed a nested property value in diagnostics')
        }

        def corruptNestedArchive = new File(temporaryDir, 'corrupt-nested-container.jar')
        def corruptNestedMember = 'BOOT-INF/lib/corrupt-first-party.jar'
        writePublicBootJarPolicyFixture(corruptNestedArchive, [
                (corruptNestedMember): 'not-a-zip-fixture'
        ])
        def corruptNestedViolations = publicBootJarSecurityViolations(
                corruptNestedArchive,
                securityTemporaryDirectory)
        if (!corruptNestedViolations.contains("${corruptNestedMember}: <nested-zip-integrity-error>")) {
            throw new GradleException('Public bootJar security policy missed nested ZIP integrity failure')
        }

        def validStoredNestedJar = new File(temporaryDir, 'valid-stored-nested.jar')
        writeStoredZipFixture(
                validStoredNestedJar,
                'payload/non-configuration.bin',
                'mutation-sensitive-payload'.getBytes(StandardCharsets.UTF_8))

        def assertExactNestedIntegrityViolation = { String fixtureName, byte[] nestedBytes ->
            def nestedMember = "BOOT-INF/lib/${fixtureName}.jar"
            def outerArchive = new File(temporaryDir, "${fixtureName}-container.jar")
            writePublicBootJarPolicyFixture(outerArchive, [(nestedMember): nestedBytes])
            def fixtureViolations = publicBootJarSecurityViolations(
                    outerArchive,
                    securityTemporaryDirectory)
            def expectedViolations = ["${nestedMember}: <nested-zip-integrity-error>"]
            if (fixtureViolations != expectedViolations) {
                throw new GradleException(
                        "Public bootJar security policy produced unexpected integrity classifications for ${nestedMember}")
            }
        }

        assertExactNestedIntegrityViolation(
                'payload-local-crc-failure',
                mutateStoredPayloadKeepingLocalCrc(validStoredNestedJar.bytes))
        assertExactNestedIntegrityViolation(
                'central-crc-only-failure',
                mutateCentralDirectoryCrcOnly(validStoredNestedJar.bytes))
        assertExactNestedIntegrityViolation(
                'truncated-end-cen-failure',
                truncateCentralDirectoryAndEnd(validStoredNestedJar.bytes))
        assertExactNestedIntegrityViolation(
                'zero-byte-invalid-zip',
                new byte[0])
    }
}

tasks.named('bootJar') {
    dependsOn tasks.named('publicBootJarSecurityPolicyTest')
}
