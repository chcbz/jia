def isForbiddenPublicBootJarMember = rootProject.ext.isForbiddenPublicArtifactJarMember

def isApiKeyProperty = { String propertyName ->
    propertyName.trim().toLowerCase(Locale.ROOT).replace('_', '-').contains('api-key')
}

def isAllowedPublicApiKeyValue = { String rawValue ->
    def value = rawValue == null ? '' : rawValue.trim()
    value.isEmpty() ||
            value ==~ /(?s)ENC\(.+\)/ ||
            value ==~ /\$\{[A-Za-z_][A-Za-z0-9_.-]*:?\}/ ||
            value ==~ /(?i)(?:test-only-dummy|dummy|fake|mock|placeholder|example|changeme|not-a-real)(?:[-_.:].*)?/
}

def readLogicalPropertyBlocks = { Reader reader ->
    def blocks = []
    def block = new StringBuilder()
    reader.eachLine { String line ->
        block.append(line).append('\n')
        int trailingBackslashes = 0
        for (int index = line.length() - 1; index >= 0 && line.charAt(index) == '\\'; index--) {
            trailingBackslashes++
        }
        if (trailingBackslashes % 2 == 0) {
            blocks << block.toString()
            block.setLength(0)
        }
    }
    if (block.length() > 0) {
        blocks << block.toString()
    }
    blocks
}

def isPublicApiKeyResource = { String memberName ->
    def normalizedName = memberName.replace('\\', '/').toLowerCase(Locale.ROOT)
    normalizedName.endsWith('.properties') ||
            normalizedName.endsWith('.yml') ||
            normalizedName.endsWith('.yaml')
}

def decodeYamlQuotedScalar = { String text, int startIndex ->
    if (startIndex >= text.length() || !(text.charAt(startIndex) in ['"' as char, '\'' as char])) {
        throw new IllegalArgumentException('yaml-quoted-scalar-required')
    }
    char quote = text.charAt(startIndex)
    def decoded = new StringBuilder()
    int index = startIndex + 1
    while (index < text.length()) {
        char character = text.charAt(index)
        if (quote == '\'' as char) {
            if (character == '\'' as char) {
                if (index + 1 < text.length() && text.charAt(index + 1) == '\'' as char) {
                    decoded.append('\'' as char)
                    index += 2
                    continue
                }
                return [value: decoded.toString(), nextIndex: index + 1]
            }
            decoded.append(character)
            index++
            continue
        }
        if (character == '"' as char) {
            return [value: decoded.toString(), nextIndex: index + 1]
        }
        if (character != '\\' as char) {
            decoded.append(character)
            index++
            continue
        }
        if (++index >= text.length()) {
            throw new IllegalArgumentException('yaml-truncated-escape')
        }
        char escaped = text.charAt(index++)
        def simpleCodePoints = [
                ('0' as char): 0x0000,
                ('a' as char): 0x0007,
                ('b' as char): 0x0008,
                ('t' as char): 0x0009,
                ('n' as char): 0x000a,
                ('v' as char): 0x000b,
                ('f' as char): 0x000c,
                ('r' as char): 0x000d,
                ('e' as char): 0x001b,
                (' ' as char): 0x0020,
                ('"' as char): 0x0022,
                ('/' as char): 0x002f,
                ('\\' as char): 0x005c,
                ('N' as char): 0x0085,
                ('_' as char): 0x00a0,
                ('L' as char): 0x2028,
                ('P' as char): 0x2029
        ]
        if (simpleCodePoints.containsKey(escaped)) {
            decoded.appendCodePoint(simpleCodePoints.get(escaped))
            continue
        }
        int digits = escaped == 'x' as char ? 2 : escaped == 'u' as char ? 4 : escaped == 'U' as char ? 8 : 0
        if (digits == 0 || index + digits > text.length()) {
            throw new IllegalArgumentException('yaml-unsupported-escape')
        }
        def hex = text.substring(index, index + digits)
        if (!(hex ==~ /[0-9A-Fa-f]+/)) {
            throw new IllegalArgumentException('yaml-invalid-unicode-escape')
        }
        long codePoint = Long.parseLong(hex, 16)
        if (codePoint > Character.MAX_CODE_POINT ||
                (codePoint >= Character.MIN_SURROGATE && codePoint <= Character.MAX_SURROGATE)) {
            throw new IllegalArgumentException('yaml-invalid-code-point')
        }
        decoded.appendCodePoint((int) codePoint)
        index += digits
    }
    throw new IllegalArgumentException('yaml-unclosed-quote')
}

def decodeYamlScalarToken = { String token, boolean key ->
    def trimmed = token.trim()
    if (!trimmed) {
        throw new IllegalArgumentException('yaml-empty-token')
    }
    if (trimmed.charAt(0) in ['"' as char, '\'' as char]) {
        def decoded = decodeYamlQuotedScalar(trimmed, 0)
        if (decoded.nextIndex != trimmed.length()) {
            throw new IllegalArgumentException('yaml-trailing-quoted-token')
        }
        return decoded.value
    }
    if (trimmed.startsWith('&') || trimmed.startsWith('*') || trimmed.startsWith('!') ||
            trimmed.startsWith('?') || trimmed.startsWith('|') || trimmed.startsWith('>') ||
            trimmed.startsWith('%') || (key && trimmed == '<<')) {
        throw new IllegalArgumentException('yaml-unsupported-token')
    }
    if (key && (trimmed.contains('{') || trimmed.contains('}') || trimmed.contains('[') ||
            trimmed.contains(']') || trimmed.contains(','))) {
        throw new IllegalArgumentException('yaml-ambiguous-key')
    }
    trimmed
}

def yamlApiKeyViolations = { String memberName, InputStream input ->
    final int maxYamlCharacters = 1_048_576
    final int maxYamlLogicalLines = 10_000
    final int maxYamlNesting = 64
    final int maxYamlTokens = 100_000
    def yamlText = new StringBuilder()
    new InputStreamReader(input, StandardCharsets.UTF_8).withCloseable { reader ->
        char[] buffer = new char[8192]
        int count
        while ((count = reader.read(buffer)) != -1) {
            if (yamlText.length() + count > maxYamlCharacters) {
                throw new IllegalArgumentException('yaml-size-limit')
            }
            yamlText.append(buffer, 0, count)
        }
    }

    def violations = new LinkedHashSet<String>()
    def stripQuoteAwareComment = { String line ->
        char quote = 0
        int index = 0
        while (index < line.length()) {
            char character = line.charAt(index)
            if (quote == '"' as char && character == '\\' as char) {
                index += 2
                continue
            }
            if (quote == '\'' as char && character == '\'' as char &&
                    index + 1 < line.length() && line.charAt(index + 1) == '\'' as char) {
                index += 2
                continue
            }
            if (quote != 0 && character == quote) {
                quote = 0
                index++
                continue
            }
            if (quote == 0 && character in ['"' as char, '\'' as char]) {
                quote = character
                index++
                continue
            }
            if (quote == 0 && character == '#' as char &&
                    (index == 0 || Character.isWhitespace(line.charAt(index - 1)))) {
                return line.substring(0, index)
            }
            index++
        }
        if (quote != 0) {
            throw new IllegalArgumentException('yaml-multiline-quote-unsupported')
        }
        line
    }

    def logicalLines = []
    def flowDelimiters = []
    String pendingContent = null
    int pendingIndent = 0
    yamlText.toString().split(/\r?\n/, -1).each { rawLine ->
        int indent = 0
        while (indent < rawLine.length() && rawLine.charAt(indent) == ' ' as char) {
            indent++
        }
        if (indent < rawLine.length() && rawLine.charAt(indent) == '\t' as char) {
            throw new IllegalArgumentException('yaml-tab-indentation')
        }
        def uncommented = stripQuoteAwareComment(rawLine)
        def fragment = uncommented.trim()
        if (pendingContent == null && !fragment) {
            return
        }
        if (pendingContent == null) {
            pendingContent = fragment
            pendingIndent = indent
        } else {
            pendingContent += ' ' + fragment
        }

        char quote = 0
        int index = 0
        while (index < fragment.length()) {
            char character = fragment.charAt(index)
            if (quote == '"' as char && character == '\\' as char) {
                index += 2
                continue
            }
            if (quote == '\'' as char && character == '\'' as char &&
                    index + 1 < fragment.length() && fragment.charAt(index + 1) == '\'' as char) {
                index += 2
                continue
            }
            if (quote != 0 && character == quote) {
                quote = 0
            } else if (quote == 0 && character in ['"' as char, '\'' as char]) {
                quote = character
            } else if (quote == 0 && character in ['{' as char, '[' as char]) {
                flowDelimiters << character
                if (flowDelimiters.size() > maxYamlNesting) {
                    throw new IllegalArgumentException('yaml-nesting-limit')
                }
            } else if (quote == 0 && character in ['}' as char, ']' as char]) {
                char expected = character == '}' as char ? '{' as char : '[' as char
                if (flowDelimiters.empty || flowDelimiters.remove(flowDelimiters.size() - 1) != expected) {
                    throw new IllegalArgumentException('yaml-flow-delimiter-mismatch')
                }
            }
            index++
        }
        if (flowDelimiters.empty) {
            logicalLines << [indent: pendingIndent, content: pendingContent]
            if (logicalLines.size() > maxYamlLogicalLines) {
                throw new IllegalArgumentException('yaml-line-limit')
            }
            pendingContent = null
        }
    }
    if (pendingContent != null || !flowDelimiters.empty) {
        throw new IllegalArgumentException('yaml-truncated-flow')
    }

    int tokenCount = 0
    def skipFlowWhitespace = { Map state ->
        while (state.index < state.text.length() && Character.isWhitespace(state.text.charAt(state.index))) {
            state.index++
        }
    }
    def findFlowSequencePairColon = { Map state ->
        char quote = 0
        int index = state.index
        while (index < state.text.length()) {
            char character = state.text.charAt(index)
            if (quote == '"' as char && character == '\\' as char) {
                index += 2
                continue
            }
            if (quote == '\'' as char && character == '\'' as char &&
                    index + 1 < state.text.length() && state.text.charAt(index + 1) == '\'' as char) {
                index += 2
                continue
            }
            if (quote != 0 && character == quote) {
                quote = 0
            } else if (quote == 0 && character in ['"' as char, '\'' as char]) {
                quote = character
            } else if (quote == 0 && character in [',' as char, ']' as char]) {
                return -1
            } else if (quote == 0 && character == ':' as char &&
                    (index + 1 == state.text.length() || Character.isWhitespace(state.text.charAt(index + 1)) ||
                            state.text.charAt(index + 1) in ['{' as char, '[' as char])) {
                return index
            }
            index++
        }
        -1
    }
    Closure parseFlowValue
    Closure parseFlowMapping
    Closure parseFlowSequence
    parseFlowValue = { Map state, int depth ->
        if (++tokenCount > maxYamlTokens || depth > maxYamlNesting) {
            throw new IllegalArgumentException('yaml-token-or-depth-limit')
        }
        skipFlowWhitespace(state)
        if (state.index >= state.text.length()) {
            throw new IllegalArgumentException('yaml-missing-flow-value')
        }
        char current = state.text.charAt(state.index)
        if (current == '{' as char) {
            parseFlowMapping(state, depth + 1)
            return [collection: true, scalar: null]
        }
        if (current == '[' as char) {
            parseFlowSequence(state, depth + 1)
            return [collection: true, scalar: null]
        }
        if (current in ['"' as char, '\'' as char]) {
            def decoded = decodeYamlQuotedScalar(state.text, state.index)
            state.index = decoded.nextIndex
            return [collection: false, scalar: decoded.value]
        }
        int start = state.index
        int interpolationDepth = 0
        while (state.index < state.text.length()) {
            char character = state.text.charAt(state.index)
            if (character == '$' as char && state.index + 1 < state.text.length() &&
                    state.text.charAt(state.index + 1) == '{' as char) {
                interpolationDepth++
                state.index += 2
                continue
            }
            if (character == '}' as char && interpolationDepth > 0) {
                interpolationDepth--
                state.index++
                continue
            }
            if (interpolationDepth == 0 && character in [',' as char, '}' as char, ']' as char]) {
                break
            }
            state.index++
        }
        if (interpolationDepth != 0) {
            throw new IllegalArgumentException('yaml-truncated-placeholder')
        }
        def scalar = decodeYamlScalarToken(state.text.substring(start, state.index), false)
        [collection: false, scalar: scalar]
    }
    parseFlowMapping = { Map state, int depth ->
        state.index++
        skipFlowWhitespace(state)
        if (state.index < state.text.length() && state.text.charAt(state.index) == '}' as char) {
            state.index++
            return
        }
        while (true) {
            if (++tokenCount > maxYamlTokens || depth > maxYamlNesting) {
                throw new IllegalArgumentException('yaml-token-or-depth-limit')
            }
            skipFlowWhitespace(state)
            if (state.index < state.text.length() && state.text.charAt(state.index) == '}' as char) {
                state.index++
                return
            }
            String decodedKey
            if (state.index < state.text.length() && state.text.charAt(state.index) in ['"' as char, '\'' as char]) {
                def decoded = decodeYamlQuotedScalar(state.text, state.index)
                decodedKey = decoded.value
                state.index = decoded.nextIndex
            } else {
                int keyStart = state.index
                while (state.index < state.text.length() && state.text.charAt(state.index) != ':' as char) {
                    if (state.text.charAt(state.index) in ['{' as char, '}' as char, '[' as char, ']' as char, ',' as char]) {
                        throw new IllegalArgumentException('yaml-complex-flow-key')
                    }
                    state.index++
                }
                decodedKey = decodeYamlScalarToken(state.text.substring(keyStart, state.index), true)
            }
            skipFlowWhitespace(state)
            if (state.index >= state.text.length() || state.text.charAt(state.index) != ':' as char) {
                throw new IllegalArgumentException('yaml-missing-flow-colon')
            }
            state.index++
            def value = parseFlowValue(state, depth)
            if (isApiKeyProperty(decodedKey)) {
                if (value.collection || !isAllowedPublicApiKeyValue(value.scalar)) {
                    violations << "${memberName}: ${decodedKey.trim()}"
                }
            }
            skipFlowWhitespace(state)
            if (state.index >= state.text.length()) {
                throw new IllegalArgumentException('yaml-truncated-flow-mapping')
            }
            char delimiter = state.text.charAt(state.index++)
            if (delimiter == '}' as char) {
                return
            }
            if (delimiter != ',' as char) {
                throw new IllegalArgumentException('yaml-invalid-flow-mapping-delimiter')
            }
        }
    }
    parseFlowSequence = { Map state, int depth ->
        state.index++
        skipFlowWhitespace(state)
        if (state.index < state.text.length() && state.text.charAt(state.index) == ']' as char) {
            state.index++
            return
        }
        while (true) {
            skipFlowWhitespace(state)
            if (state.index < state.text.length() && state.text.charAt(state.index) == ']' as char) {
                state.index++
                return
            }
            char itemStart = state.text.charAt(state.index)
            int pairColon = (itemStart in ['{' as char, '[' as char])
                    ? -1
                    : findFlowSequencePairColon(state)
            if (itemStart in ['{' as char, '[' as char]) {
                parseFlowValue(state, depth)
            } else if (pairColon >= 0) {
                def decodedKey = decodeYamlScalarToken(
                        state.text.substring(state.index, pairColon),
                        true)
                state.index = pairColon + 1
                def value = parseFlowValue(state, depth)
                if (isApiKeyProperty(decodedKey) &&
                        (value.collection || !isAllowedPublicApiKeyValue(value.scalar))) {
                    violations << "${memberName}: ${decodedKey.trim()}"
                }
            } else {
                parseFlowValue(state, depth)
            }
            skipFlowWhitespace(state)
            if (state.index >= state.text.length()) {
                throw new IllegalArgumentException('yaml-truncated-flow-sequence')
            }
            char delimiter = state.text.charAt(state.index++)
            if (delimiter == ']' as char) {
                return
            }
            if (delimiter != ',' as char) {
                throw new IllegalArgumentException('yaml-invalid-flow-sequence-delimiter')
            }
        }
    }
    def parseFlowDocument = { String flowText ->
        def state = [text: flowText, index: 0]
        parseFlowValue(state, 0)
        skipFlowWhitespace(state)
        if (state.index != state.text.length()) {
            throw new IllegalArgumentException('yaml-trailing-flow-content')
        }
    }

    def findBlockMappingColon = { String content ->
        char quote = 0
        int flowDepth = 0
        int index = 0
        while (index < content.length()) {
            char character = content.charAt(index)
            if (quote == '"' as char && character == '\\' as char) {
                index += 2
                continue
            }
            if (quote == '\'' as char && character == '\'' as char &&
                    index + 1 < content.length() && content.charAt(index + 1) == '\'' as char) {
                index += 2
                continue
            }
            if (quote != 0 && character == quote) {
                quote = 0
            } else if (quote == 0 && character in ['"' as char, '\'' as char]) {
                quote = character
            } else if (quote == 0 && character in ['{' as char, '[' as char]) {
                flowDepth++
            } else if (quote == 0 && character in ['}' as char, ']' as char]) {
                flowDepth--
            } else if (quote == 0 && flowDepth == 0 && character == ':' as char &&
                    (index + 1 == content.length() || Character.isWhitespace(content.charAt(index + 1)) ||
                            content.charAt(index + 1) in ['{' as char, '[' as char])) {
                return index
            }
            index++
        }
        -1
    }

    def indentationLevels = []
    boolean previousAllowsNested = true
    logicalLines.each { logicalLine ->
        int indent = logicalLine.indent
        String content = logicalLine.content
        if (content == '---' || content == '...') {
            if (indent != 0) {
                throw new IllegalArgumentException('yaml-document-marker-indentation')
            }
            indentationLevels.clear()
            previousAllowsNested = true
            return
        }
        if (content.startsWith('%')) {
            throw new IllegalArgumentException('yaml-directive-unsupported')
        }
        if (indentationLevels.empty) {
            if (indent != 0) {
                throw new IllegalArgumentException('yaml-root-indentation')
            }
            indentationLevels << 0
        } else {
            while (!indentationLevels.empty && indent < indentationLevels.last()) {
                indentationLevels.remove(indentationLevels.size() - 1)
            }
            if (indentationLevels.empty) {
                throw new IllegalArgumentException('yaml-indentation-underflow')
            }
            if (indent > indentationLevels.last()) {
                if (!previousAllowsNested || indentationLevels.size() >= maxYamlNesting) {
                    throw new IllegalArgumentException('yaml-unexpected-indentation')
                }
                indentationLevels << indent
            } else if (indent != indentationLevels.last()) {
                throw new IllegalArgumentException('yaml-ambiguous-indentation')
            }
        }

        int sequenceContentIndent = indent
        boolean sequenceItem = false
        while (content == '-' || content.startsWith('- ')) {
            sequenceItem = true
            if (content == '-') {
                content = ''
                sequenceContentIndent++
                break
            }
            int prefix = 1
            while (prefix < content.length() && content.charAt(prefix) == ' ' as char) {
                prefix++
            }
            sequenceContentIndent += prefix
            content = content.substring(prefix).trim()
        }
        if (!content) {
            previousAllowsNested = true
            return
        }
        if (content.startsWith('{') || content.startsWith('[')) {
            parseFlowDocument(content)
            previousAllowsNested = false
            return
        }

        int colonIndex = findBlockMappingColon(content)
        if (colonIndex < 0) {
            decodeYamlScalarToken(content, false)
            previousAllowsNested = false
            return
        }
        def decodedKey = decodeYamlScalarToken(content.substring(0, colonIndex), true)
        def valueToken = content.substring(colonIndex + 1).trim()
        boolean valueIsCollection = false
        String scalarValue = ''
        if (valueToken) {
            if (valueToken.startsWith('{') || valueToken.startsWith('[')) {
                parseFlowDocument(valueToken)
                valueIsCollection = true
            } else {
                scalarValue = decodeYamlScalarToken(valueToken, false)
            }
        }
        if (isApiKeyProperty(decodedKey) &&
                (valueIsCollection || !isAllowedPublicApiKeyValue(scalarValue))) {
            violations << "${memberName}: ${decodedKey.trim()}"
        }
        if (sequenceItem && sequenceContentIndent > indentationLevels.last()) {
            indentationLevels << sequenceContentIndent
        }
        previousAllowsNested = !valueToken || sequenceItem
    }
    violations
}

def publicApiKeyResourceViolations = { String memberName, InputStream input ->
    def normalizedName = memberName.replace('\\', '/').toLowerCase(Locale.ROOT)
    if (!normalizedName.endsWith('.properties')) {
        return yamlApiKeyViolations(memberName, input)
    }

    def violations = new LinkedHashSet<String>()
    new InputStreamReader(input, StandardCharsets.UTF_8).withCloseable { reader ->
        readLogicalPropertyBlocks(reader).each { block ->
            def properties = new Properties()
            properties.load(new StringReader(block))
            properties.stringPropertyNames().sort().each { propertyName ->
                if (isApiKeyProperty(propertyName) &&
                        !isAllowedPublicApiKeyValue(properties.getProperty(propertyName))) {
                    violations << "${memberName}: ${propertyName}"
                }
            }
        }
    }
    violations
}

def drainArchiveMember = { InputStream input ->
    def crc = new CRC32()
    long size = 0
    byte[] buffer = new byte[8192]
    int count
    while ((count = input.read(buffer)) != -1) {
        crc.update(buffer, 0, count)
        size += count
    }
    [size: size, crc: crc.value]
}

def archiveInventoryRecord = { ZipEntry entry ->
    [
            name: entry.name,
            directory: entry.directory,
            method: entry.method,
            size: entry.size,
            compressedSize: entry.compressedSize,
            crc: entry.crc
    ]
}

def validateNestedZipIntegrity = { Path archive ->
    if (Files.size(archive) == 0) {
        throw new IllegalArgumentException('zero-byte-nested-zip')
    }
    def localInventory = []
    new ZipInputStream(new BufferedInputStream(Files.newInputStream(archive))).withCloseable { input ->
        ZipEntry entry
        while ((entry = input.nextEntry) != null) {
            def actual = drainArchiveMember(input)
            input.closeEntry()
            if (!(entry.method in [ZipEntry.STORED, ZipEntry.DEFLATED]) ||
                    entry.size < 0 || entry.compressedSize < 0 || entry.crc < 0 ||
                    entry.size != actual.size || entry.crc != actual.crc ||
                    (entry.directory && actual.size != 0)) {
                throw new IllegalArgumentException('nested-local-record-mismatch')
            }
            localInventory << archiveInventoryRecord(entry)
        }
    }

    def centralInventory = []
    new ZipFile(archive.toFile()).withCloseable { zip ->
        Collections.list(zip.entries()).each { entry ->
            if (!(entry.method in [ZipEntry.STORED, ZipEntry.DEFLATED]) ||
                    entry.size < 0 || entry.compressedSize < 0 || entry.crc < 0) {
                throw new IllegalArgumentException('nested-central-record-invalid')
            }
            def actual = [size: 0L, crc: 0L]
            if (!entry.directory) {
                zip.getInputStream(entry).withCloseable { input ->
                    actual = drainArchiveMember(input)
                }
            }
            if (entry.size != actual.size || entry.crc != actual.crc ||
                    (entry.directory && (entry.size != 0 || entry.crc != 0))) {
                throw new IllegalArgumentException('nested-central-record-mismatch')
            }
            centralInventory << archiveInventoryRecord(entry)
        }
    }
    if (localInventory != centralInventory) {
        throw new IllegalArgumentException('nested-inventory-divergence')
    }
}

def publicBootJarSecurityViolations = { File archive, File securityTemporaryDirectory ->
    def violations = new LinkedHashSet<String>()
    Path securityTemporaryPath = securityTemporaryDirectory.toPath()

    new ZipFile(archive).withCloseable { zip ->
        Collections.list(zip.entries()).sort { left, right -> left.name <=> right.name }.each { entry ->
            def memberName = entry.name
            def normalizedName = memberName.replace('\\', '/').toLowerCase(Locale.ROOT)
            if (isForbiddenPublicBootJarMember(memberName)) {
                violations << memberName
            }
            if (!entry.directory &&
                    normalizedName.startsWith('boot-inf/classes/') &&
                    isPublicApiKeyResource(memberName)) {
                try {
                    zip.getInputStream(entry).withCloseable { input ->
                        violations.addAll(publicApiKeyResourceViolations(memberName, input))
                    }
                } catch (Exception ignored) {
                    violations << "${memberName}: <configuration-parse-error>"
                }
            }
            if (!entry.directory &&
                    normalizedName.startsWith('boot-inf/lib/') &&
                    normalizedName.endsWith('.jar')) {
                Path nestedArchive = null
                boolean cleanupFailed = false
                try {
                    Files.createDirectories(securityTemporaryPath)
                    if (!Files.isDirectory(securityTemporaryPath, LinkOption.NOFOLLOW_LINKS) ||
                            Files.isSymbolicLink(securityTemporaryPath)) {
                        throw new SecurityException('nested-temp-directory-invalid')
                    }
                    def posixView = Files.getFileAttributeView(
                            securityTemporaryPath,
                            PosixFileAttributeView,
                            LinkOption.NOFOLLOW_LINKS)
                    if (posixView != null) {
                        def ownerOnlyPermissions = EnumSet.of(
                                PosixFilePermission.OWNER_READ,
                                PosixFilePermission.OWNER_WRITE)
                        nestedArchive = Files.createTempFile(
                                securityTemporaryPath,
                                'public-bootjar-nested-',
                                '.jar',
                                PosixFilePermissions.asFileAttribute(ownerOnlyPermissions))
                        if (Files.getPosixFilePermissions(nestedArchive, LinkOption.NOFOLLOW_LINKS) !=
                                ownerOnlyPermissions) {
                            throw new SecurityException('nested-temp-posix-permission-mismatch')
                        }
                    } else {
                        nestedArchive = Files.createTempFile(
                                securityTemporaryPath,
                                'public-bootjar-nested-',
                                '.jar')
                        def aclView = Files.getFileAttributeView(
                                nestedArchive,
                                AclFileAttributeView,
                                LinkOption.NOFOLLOW_LINKS)
                        if (aclView == null) {
                            throw new SecurityException('nested-temp-acl-unavailable')
                        }
                        def owner = Files.getOwner(nestedArchive, LinkOption.NOFOLLOW_LINKS)
                        def ownerPermissions = EnumSet.noneOf(AclEntryPermission)
                        ownerPermissions.addAll([
                                AclEntryPermission.READ_DATA,
                                AclEntryPermission.WRITE_DATA,
                                AclEntryPermission.APPEND_DATA,
                                AclEntryPermission.READ_ATTRIBUTES,
                                AclEntryPermission.WRITE_ATTRIBUTES,
                                AclEntryPermission.READ_ACL,
                                AclEntryPermission.WRITE_ACL,
                                AclEntryPermission.DELETE,
                                AclEntryPermission.SYNCHRONIZE
                        ])
                        def ownerEntry = AclEntry.newBuilder()
                                .setType(AclEntryType.ALLOW)
                                .setPrincipal(owner)
                                .setPermissions(ownerPermissions)
                                .build()
                        aclView.setAcl([ownerEntry])
                        def effectiveAcl = aclView.getAcl()
                        def readablePermissions = EnumSet.of(
                                AclEntryPermission.READ_DATA,
                                AclEntryPermission.READ_ATTRIBUTES,
                                AclEntryPermission.READ_NAMED_ATTRS,
                                AclEntryPermission.EXECUTE)
                        boolean ownerReadWrite = effectiveAcl.any { aclEntry ->
                            aclEntry.type() == AclEntryType.ALLOW &&
                                    aclEntry.principal() == owner &&
                                    aclEntry.permissions().contains(AclEntryPermission.READ_DATA) &&
                                    aclEntry.permissions().contains(AclEntryPermission.WRITE_DATA)
                        }
                        boolean nonOwnerReadable = effectiveAcl.any { aclEntry ->
                            aclEntry.type() == AclEntryType.ALLOW &&
                                    aclEntry.principal() != owner &&
                                    !Collections.disjoint(aclEntry.permissions(), readablePermissions)
                        }
                        if (!ownerReadWrite || nonOwnerReadable) {
                            throw new SecurityException('nested-temp-acl-permission-mismatch')
                        }
                    }

                    if (!Files.isRegularFile(nestedArchive, LinkOption.NOFOLLOW_LINKS) ||
                            Files.isSymbolicLink(nestedArchive)) {
                        throw new SecurityException('nested-temp-file-invalid')
                    }
                    zip.getInputStream(entry).withCloseable { input ->
                        Files.newOutputStream(
                                nestedArchive,
                                StandardOpenOption.WRITE,
                                StandardOpenOption.TRUNCATE_EXISTING).withCloseable { output ->
                            input.transferTo(output)
                        }
                    }
                    validateNestedZipIntegrity(nestedArchive)
                    new ZipFile(nestedArchive.toFile()).withCloseable { nestedZip ->
                        Collections.list(nestedZip.entries()).each { nestedEntry ->
                            def nestedMemberName = nestedEntry.name
                            def qualifiedMemberName = "${memberName}!${nestedMemberName}"
                            if (isForbiddenPublicBootJarMember(nestedMemberName)) {
                                violations << qualifiedMemberName
                            }
                            if (!nestedEntry.directory && isPublicApiKeyResource(nestedMemberName)) {
                                try {
                                    nestedZip.getInputStream(nestedEntry).withCloseable { input ->
                                        violations.addAll(publicApiKeyResourceViolations(qualifiedMemberName, input))
                                    }
                                } catch (Exception ignored) {
                                    violations << "${qualifiedMemberName}: <configuration-parse-error>"
                                }
                            }
                        }
                    }
                } catch (Exception ignored) {
                    violations << "${memberName}: <nested-zip-integrity-error>"
                } finally {
                    if (nestedArchive != null) {
                        try {
                            Files.deleteIfExists(nestedArchive)
                        } catch (Exception ignored) {
                            cleanupFailed = true
                        }
                    }
                }
                if (cleanupFailed) {
                    violations << "${memberName}: <nested-temp-cleanup-error>"
                }
            }
        }
    }
    violations as List
}

def writePublicBootJarPolicyFixture = { File archive, Map<String, ?> members ->
    archive.parentFile.mkdirs()
    new ZipOutputStream(new FileOutputStream(archive)).withCloseable { output ->
        members.each { memberName, content ->
            output.putNextEntry(new ZipEntry(memberName))
            byte[] payload = content instanceof byte[]
                    ? (byte[]) content
                    : content.toString().getBytes(StandardCharsets.UTF_8)
            output.write(payload)
            output.closeEntry()
        }
    }
}

def writeStoredZipFixture = { File archive, String memberName, byte[] payload ->
    archive.parentFile.mkdirs()
    def crc = new CRC32()
    crc.update(payload)
    def entry = new ZipEntry(memberName)
    entry.method = ZipEntry.STORED
    entry.size = payload.length
    entry.compressedSize = payload.length
    entry.crc = crc.value
    new ZipOutputStream(new FileOutputStream(archive)).withCloseable { output ->
        output.putNextEntry(entry)
        output.write(payload)
        output.closeEntry()
    }
}

def findZipSignature = { byte[] archive, int signature, int startIndex ->
    for (int index = Math.max(0, startIndex); index <= archive.length - 4; index++) {
        int candidate = (archive[index] & 0xff) |
                ((archive[index + 1] & 0xff) << 8) |
                ((archive[index + 2] & 0xff) << 16) |
                ((archive[index + 3] & 0xff) << 24)
        if (candidate == signature) {
            return index
        }
    }
    throw new IllegalArgumentException('zip-fixture-signature-missing')
}

def readZipUnsignedShort = { byte[] archive, int offset ->
    (archive[offset] & 0xff) | ((archive[offset + 1] & 0xff) << 8)
}

def readZipUnsignedInt = { byte[] archive, int offset ->
    ((long) archive[offset] & 0xffL) |
            (((long) archive[offset + 1] & 0xffL) << 8) |
            (((long) archive[offset + 2] & 0xffL) << 16) |
            (((long) archive[offset + 3] & 0xffL) << 24)
}

def writeZipUnsignedInt = { byte[] archive, int offset, long value ->
    archive[offset] = (byte) value
    archive[offset + 1] = (byte) (value >>> 8)
    archive[offset + 2] = (byte) (value >>> 16)
    archive[offset + 3] = (byte) (value >>> 24)
}

def mutateStoredPayloadKeepingLocalCrc = { byte[] validArchive ->
    byte[] mutated = validArchive.clone()
    int localOffset = findZipSignature(mutated, 0x04034b50, 0)
    int centralOffset = findZipSignature(mutated, 0x02014b50, localOffset + 4)
    int nameLength = readZipUnsignedShort(mutated, localOffset + 26)
    int extraLength = readZipUnsignedShort(mutated, localOffset + 28)
    int payloadOffset = localOffset + 30 + nameLength + extraLength
    int payloadLength = (int) readZipUnsignedInt(mutated, localOffset + 18)
    if (payloadLength <= 0 || payloadOffset + payloadLength > mutated.length) {
        throw new IllegalArgumentException('zip-fixture-payload-range-invalid')
    }
    long originalLocalCrc = readZipUnsignedInt(mutated, localOffset + 14)
    mutated[payloadOffset] = (byte) (mutated[payloadOffset] ^ 0x01)
    def actual = new CRC32()
    actual.update(mutated, payloadOffset, payloadLength)
    if (actual.value == originalLocalCrc) {
        throw new IllegalArgumentException('zip-fixture-payload-mutation-insensitive')
    }
    writeZipUnsignedInt(mutated, centralOffset + 16, actual.value)
    if (readZipUnsignedInt(mutated, localOffset + 14) != originalLocalCrc ||
            readZipUnsignedInt(mutated, centralOffset + 16) != actual.value) {
        throw new IllegalArgumentException('zip-fixture-local-crc-isolation-failed')
    }
    mutated
}

def mutateCentralDirectoryCrcOnly = { byte[] validArchive ->
    byte[] mutated = validArchive.clone()
    int localOffset = findZipSignature(mutated, 0x04034b50, 0)
    int centralOffset = findZipSignature(mutated, 0x02014b50, localOffset + 4)
    long originalLocalCrc = readZipUnsignedInt(mutated, localOffset + 14)
    long originalCentralCrc = readZipUnsignedInt(mutated, centralOffset + 16)
    if (originalLocalCrc != originalCentralCrc) {
        throw new IllegalArgumentException('zip-fixture-central-crc-preimage-invalid')
    }
    writeZipUnsignedInt(mutated, centralOffset + 16, originalCentralCrc ^ 0x00000001L)
    if (readZipUnsignedInt(mutated, localOffset + 14) != originalLocalCrc ||
            readZipUnsignedInt(mutated, centralOffset + 16) == originalCentralCrc) {
        throw new IllegalArgumentException('zip-fixture-central-crc-mutation-failed')
    }
    mutated
}

def truncateCentralDirectoryAndEnd = { byte[] validArchive ->
    int centralOffset = findZipSignature(validArchive, 0x02014b50, 0)
    int endOffset = findZipSignature(validArchive, 0x06054b50, centralOffset + 4)
    if (centralOffset + 12 >= validArchive.length) {
        throw new IllegalArgumentException('zip-fixture-truncation-range-invalid')
    }
    byte[] truncated = Arrays.copyOf(validArchive, centralOffset + 12)
    if (endOffset < truncated.length) {
        throw new IllegalArgumentException('zip-fixture-end-truncation-failed')
    }
    truncated
}

