# Disposable only. Every value is supplied by Main; no credential is stored here.
server.address=${CYF_FIXTURE_HOST}
server.port=${CYF_FIXTURE_PORT:0}
spring.datasource.url=${CYF_H02_MYSQL_URL}
spring.datasource.username=${CYF_H02_MYSQL_USER:root}
spring.datasource.password=${CYF_H02_MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.data.redis.host=${CYF_REDIS_HOST}
spring.data.redis.port=${CYF_REDIS_PORT}
spring.data.redis.password=${CYF_REDIS_PASSWORD}
spring.main.banner-mode=off
# No provider model may initialize in this no-paid-model fixture; the fixture supplies its own fail-closed ChatModel.
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.embedding.text=none
spring.ai.model.embedding.multimodal=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
spring.ai.mcp.client.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration,org.springframework.boot.elasticsearch.autoconfigure.ElasticsearchClientAutoConfiguration
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.sql.init.schema-locations=classpath:archive-real-runtime-seed.sql
jia.chat.ai.enabled=false
jia.chat.service.websocket.enable=true
user.permit.ignore-uris[0]=/ws/**
jia.chat.service.websocket.allowed-origin-patterns=${CYF_FIXTURE_WEB_ORIGIN},http://127.0.0.1:*,http://localhost:*
cors.allowed.origin.patterns=${CYF_FIXTURE_WEB_ORIGIN}
archive.reader.enabled=true
archive.maintenance.execution-enabled=true
archive.maintenance.business-outbox.enabled=true
archive.maintenance.manager-grants[0].collection-id=platform-classics
archive.maintenance.manager-grants[0].tenant-id=0
archive.maintenance.manager-grants[0].client-id=${CYF_FIXTURE_CLIENT}
archive.maintenance.manager-grants[0].owner-jiacn=${CYF_FIXTURE_OWNER}
archive.maintenance.manager-grants[0].permissions=appoint,source.prepare,job.create,job.manage,draft.write,validate,publish,edition.withdraw
archive.maintenance.manager-grants[0].authorization-revision=1
agent.platform-skills.enabled=true
agent.task-artifact-storage.enabled=true
agent.task-artifact-storage.root-directory=${CYF_FIXTURE_ARTIFACT_ROOT}
agent.task-artifact-storage.max-content-bytes=16777216
agent.command-outbox.enabled=true
agent.rabbit-topology.enabled=true
agent.rabbit-publish.enabled=true
agent.rabbit-consume.enabled=true
agent.rabbit-dispatch.enabled=true
agent.rabbit-broker.host=${CYF_RABBIT_HOST}
agent.rabbit-broker.port=${CYF_RABBIT_PORT}
agent.rabbit-broker.virtual-host=${CYF_RABBIT_VHOST}
agent.rabbit-broker.username=${CYF_RABBIT_USERNAME}
agent.rabbit-broker.password=${CYF_RABBIT_PASSWORD}
agent.rabbit-dispatch.allowed-scopes[0].tenant-id=0
agent.rabbit-dispatch.allowed-scopes[0].client-id=${CYF_FIXTURE_CLIENT}
economy.skill.marketplace.enabled=false
oauth.resource.uris[0]=/archive/**
oauth.resource.uris[1]=/agent/platform-skills/**
oauth.resource.uris[2]=/chat/**
