// Full archive-domain regression without compiling unrelated historical chat tests.
// Includes existing failures; never excludes them to manufacture a green result.
def archiveRegressionSourceSet = sourceSets.create('archiveRegression') {
    java {
        srcDir 'src/test/java'
        include 'cn/jia/chat/archive/**/*.java'
    }
    resources.srcDir 'src/test/resources'
    compileClasspath += sourceSets.main.output
    runtimeClasspath += output + compileClasspath
}
configurations.named(archiveRegressionSourceSet.implementationConfigurationName) {
    extendsFrom configurations.testImplementation
}
configurations.named(archiveRegressionSourceSet.runtimeOnlyConfigurationName) {
    extendsFrom configurations.testRuntimeOnly
}
tasks.register('archiveRegression', Test) {
    group = 'verification'
    description = 'Runs the entire archive domain, including legacy reader, private data and question regressions.'
    dependsOn tasks.named(archiveRegressionSourceSet.classesTaskName)
    testClassesDirs = archiveRegressionSourceSet.output.classesDirs
    classpath = sourceSets.main.output + archiveRegressionSourceSet.runtimeClasspath
    maxParallelForks = 1
    maxHeapSize = '256m'
    useJUnitPlatform()
}

// Bounded disposable cross-component fixture. Main owns execution under the global Gradle lock.
tasks.register('archiveCrossComponentFixtureServer', JavaExec) {
    group = 'verification'
    description = 'Runs the bounded real Archive HTTP/JDBC/Client fixture server.'
    dependsOn tasks.named(archiveMaintenanceMvpSourceSet.classesTaskName)
    classpath = archiveMaintenanceMvpSourceSet.runtimeClasspath
    mainClass = 'cn.jia.chat.archive.maintenance.integration.ArchiveCrossComponentFixtureServer'
    maxHeapSize = '256m'
    jvmArgs '-XX:MaxMetaspaceSize=160m', '-Xss256k'
}
