// MMD-U1 controlled-provider registration sibling; independent of immutable fast-v1/native-v1.
def mmdU1ProviderCredentialBindingSourceSet = sourceSets.create('mmdU1ProviderCredentialBinding') {
    java {
        srcDir 'src/chatDeliberationTest/java'
        include 'cn/jia/chat/handler/NativeProviderCredentialBindingDeclarationTest.java'
        include 'cn/jia/chat/handler/AgentWebSocketNativeProviderCredentialBindingTest.java'
        include 'cn/jia/chat/handler/NativeBountyExecutionDeclarationTest.java'
        include 'cn/jia/chat/handler/AgentWebSocketNativeBountyExecutionTest.java'
        include 'cn/jia/agent/security/NativeBountyCurrentBindingTest.java'
        include 'cn/jia/chat/handler/AgentRuntimeCapabilitiesTest.java'
    }
    resources.srcDir 'src/chatDeliberationTest/resources'
    compileClasspath += sourceSets.main.output
    runtimeClasspath += output + compileClasspath
}
// These six fixtures use production WebSocket/runtime identity classes plus JUnit/Mockito.
// They do not import common:jia-common-test, BaseTest or Testable, so keep that annotation
// processor and unrelated service-test graph outside this bounded source set.
configurations.named(mmdU1ProviderCredentialBindingSourceSet.implementationConfigurationName) {
    extendsFrom configurations.implementation
}
configurations.named(mmdU1ProviderCredentialBindingSourceSet.runtimeOnlyConfigurationName) {
    extendsFrom configurations.runtimeOnly
}
dependencies {
    add(mmdU1ProviderCredentialBindingSourceSet.implementationConfigurationName,
            platform("org.springframework.boot:spring-boot-dependencies:${libs.versions.spring.boot.asProvider().get()}"))
    add(mmdU1ProviderCredentialBindingSourceSet.implementationConfigurationName, libs.junit.jupiter)
    add(mmdU1ProviderCredentialBindingSourceSet.implementationConfigurationName, 'org.mockito:mockito-core')
    add(mmdU1ProviderCredentialBindingSourceSet.implementationConfigurationName,
            libs.spring.boot.starter.websocket)
    add(mmdU1ProviderCredentialBindingSourceSet.implementationConfigurationName,
            project(':oauth:jia-oauth-api'))
    add(mmdU1ProviderCredentialBindingSourceSet.implementationConfigurationName,
            project(':agent:jia-agent-mapper'))
    add(mmdU1ProviderCredentialBindingSourceSet.runtimeOnlyConfigurationName,
            'org.junit.platform:junit-platform-launcher:6.0.1')
}
tasks.register('mmdU1ProviderCredentialBinding', Test) {
    maxParallelForks = 1
    maxHeapSize = '256m'
    jvmArgs '-XX:+UseSerialGC', '-XX:ActiveProcessorCount=2',
            '-XX:MaxMetaspaceSize=192m', '-Xss256k'
    group = 'verification'
    description = 'Runs exact controlled-provider declaration and current authenticated-session lookup regressions.'
    dependsOn tasks.named(mmdU1ProviderCredentialBindingSourceSet.classesTaskName)
    testClassesDirs = mmdU1ProviderCredentialBindingSourceSet.output.classesDirs
    classpath = mmdU1ProviderCredentialBindingSourceSet.runtimeClasspath
    useJUnitPlatform()
}
