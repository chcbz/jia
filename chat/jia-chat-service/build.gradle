version = '1.1.2-SNAPSHOT'
description = 'jia-chat-service'

// D02 source-only verification slice. It avoids compiling unrelated historical chat tests.
def juyitingExecutionReportSourceSet = sourceSets.create('juyitingExecutionReport') {
    java.srcDir 'src/juyitingExecutionReportTest/java'
    resources.srcDir 'src/juyitingExecutionReportTest/resources'
    compileClasspath += sourceSets.main.output
    runtimeClasspath += output + compileClasspath
}
configurations.named(juyitingExecutionReportSourceSet.implementationConfigurationName) {
    extendsFrom configurations.testImplementation
}
configurations.named(juyitingExecutionReportSourceSet.runtimeOnlyConfigurationName) {
    extendsFrom configurations.testRuntimeOnly
}
tasks.register('juyitingExecutionReport', Test) {
    group = 'verification'
    description = 'Runs D02 durable Agent report service, WebSocket and schema contract tests.'
    dependsOn tasks.named(juyitingExecutionReportSourceSet.classesTaskName)
    testClassesDirs = juyitingExecutionReportSourceSet.output.classesDirs
    classpath = juyitingExecutionReportSourceSet.runtimeClasspath
    useJUnitPlatform()
}

// 1.13.20 BF07/BF08 focused regression; default test remains unchanged.
// Compile and run separately on the shared low-memory local build host.
def bf08FormalFlowSourceSet = sourceSets.create('bf08FormalFlow') {
    java {
        srcDir 'src/test/java'
        include 'cn/jia/chat/handler/AgentWebSocketHandlerTest.java'
        include 'cn/jia/chat/api/ChatControllerTest.java'
    }
    resources.srcDir 'src/test/resources'
    compileClasspath += sourceSets.main.output
    runtimeClasspath += output + compileClasspath
}
configurations.named(bf08FormalFlowSourceSet.implementationConfigurationName) {
    extendsFrom configurations.testImplementation
}
configurations.named(bf08FormalFlowSourceSet.runtimeOnlyConfigurationName) {
    extendsFrom configurations.testRuntimeOnly
}
tasks.register('bf08FormalFlow', Test) {
    group = 'verification'
    description = 'Runs BF07/BF08 formal origin, legacy, delivery, chat scope and reference regressions.'
    dependsOn tasks.named(bf08FormalFlowSourceSet.classesTaskName)
    testClassesDirs = bf08FormalFlowSourceSet.output.classesDirs
    classpath = bf08FormalFlowSourceSet.runtimeClasspath
    useJUnitPlatform()
}


// Managed onboarding websocket authorization slice. It proves that only the exact
// paid managed key may bridge a PROVISIONED identity into its first registration.
def managedHostingHandshakeSourceSet = sourceSets.create('managedHostingHandshake') {
    java {
        srcDir 'src/test/java'
        include 'cn/jia/chat/config/ApiKeyHandshakeInterceptorManagedOnboardingTest.java'
        include 'cn/jia/chat/config/ApiKeyHandshakeInterceptorManagedRefundTest.java'
    }
    resources.srcDir 'src/test/resources'
    compileClasspath += sourceSets.main.output
    runtimeClasspath += output + compileClasspath
}
configurations.named(managedHostingHandshakeSourceSet.implementationConfigurationName) {
    extendsFrom configurations.testImplementation
}
configurations.named(managedHostingHandshakeSourceSet.runtimeOnlyConfigurationName) {
    extendsFrom configurations.testRuntimeOnly
}
tasks.register('managedHostingHandshake', Test) {
    maxParallelForks = 1
    maxHeapSize = '256m'
    jvmArgs '-XX:MaxMetaspaceSize=160m', '-Xss256k'
    group = 'verification'
    description = 'Runs exact managed-key first-websocket authorization regressions.'
    dependsOn tasks.named(managedHostingHandshakeSourceSet.classesTaskName)
    testClassesDirs = managedHostingHandshakeSourceSet.output.classesDirs
    classpath = managedHostingHandshakeSourceSet.runtimeClasspath
    useJUnitPlatform()
}


