def poiOoxmlRuntimeVersion = libs.versions.poi.ooxml.full.get()

dependencies {
    api project(':agent:jia-agent-api')
    implementation project(':chat:jia-chat-api')
    implementation project(':economy:jia-economy-api')
    implementation project(':economy:jia-economy-mapper')
    implementation project(':economy:jia-economy-service')
    implementation project(':user:jia-user-api')
    implementation project(':agent:jia-agent-mapper')
    implementation project(':economy:jia-economy-api')
    compileOnly project(':task:jia-task-core')
    compileOnly project(':task:jia-task-api')
    compileOnly project(':oauth:jia-oauth-api')
    compileOnly 'org.springframework.security:spring-security-config'
    compileOnly 'org.springframework.security:spring-security-web'
    testImplementation 'org.springframework.security:spring-security-config'
    testImplementation 'org.springframework.security:spring-security-web'
    compileOnly 'org.springframework.security:spring-security-oauth2-resource-server'
    compileOnly 'org.springframework.security:spring-security-oauth2-jose'
    implementation project(':common:jia-common-service')
    implementation libs.spring.rabbit
    implementation libs.jackson.databind
    // Keep the workspace document runtime on one POI generation. POI 3.14
    // combined with xmlbeans/full schemas from POI 5.4 fails at runtime with
    // XmlOptions.put(Object) and CTPoint2D.setX(long) NoSuchMethodError. The
    // shared poi-ooxml-core alias remains 3.14 only for legacy compile-only
    // utilities; this production path uses the 5.4 API and full schema set.
    // Exclude POI 5's default lite schemas so each generated class has one owner.
    implementation("org.apache.poi:poi-ooxml:${poiOoxmlRuntimeVersion}") {
        exclude group: 'org.apache.poi', module: 'poi-ooxml-lite'
    }
    implementation libs.poi.ooxml.full
    implementation libs.pdfbox.core
    testImplementation project(':common:jia-common-test')
    testImplementation project(':task:jia-task-core')
    testImplementation project(':task:jia-task-api')
    // W04 integration sources exercise production task and economy collaborators.
    testImplementation project(':task:jia-task-service')
    testImplementation project(':task:jia-task-mapper')
    testImplementation project(':economy:jia-economy-service')
    testImplementation project(':economy:jia-economy-mapper')
    testImplementation project(':oauth:jia-oauth-api')
    testImplementation 'org.springframework.security:spring-security-oauth2-resource-server'
    testImplementation 'org.springframework.security:spring-security-oauth2-jose'
    testImplementation platform("org.springframework.boot:spring-boot-dependencies:${libs.versions.spring.boot.asProvider().get()}")
    testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly libs.mysql
}

version = '1.1.2-SNAPSHOT'
description = 'jia-agent-service'

// This isolated fixture reports sanitized DAO stage/reason/key shapes. Emit its
// assertion message even under Flow's short test logging; do not dump other tests,
// runtime environment, request bodies, or database connection properties.
tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
    // Keep the original real-fixture exception chain visible in the immutable
    // cloud job log; a sanitized SQLState alone cannot identify an engine failure.
    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showExceptions true
        showCauses true
        showStackTraces true
    }
    afterTest { descriptor, result ->
        if (descriptor.className == 'cn.jia.agent.service.impl.AgentCommandOperationsRealTransactionTest'
                && result.resultType == org.gradle.api.tasks.testing.TestResult.ResultType.FAILURE) {
            result.exceptions.each { failure ->
                String diagnostic = failure.message ?: ''
                if (diagnostic.startsWith('Initial async acceptance rejected: reason=')) {
                    logger.lifecycle('CYF_A16_TX_DIAGNOSTIC ' + diagnostic.take(8192))
                }
            }
        }
    }
}

// The default `test` task compiles every historical test source before honoring
// `--tests`. A number of legacy fixtures still target pre-owner-scope APIs, so
// they currently prevent the 1.13.1 workspace regression tests from starting.
// Keep the default suite unchanged (and its debt visible); this source set is a
// separately named, auditable local regression suite for the closed-loop
// contracts below. It never contributes production classes or masks `test`.
def v1131RegressionSourceSet = sourceSets.create('v1131Regression') {
    java {
        srcDir 'src/test/java'
        include 'cn/jia/agent/service/impl/PersonalWorkspaceServiceImplTest.java'
        include 'cn/jia/agent/service/impl/PersonalWorkspaceTaskLinkServiceImplTest.java'
        include 'cn/jia/agent/service/impl/PersonalWorkspaceConversationLinkServiceImplTest.java'
        include 'cn/jia/agent/service/impl/PersonalWorkspaceExecutionServiceImplTest.java'
        include 'cn/jia/agent/service/impl/AgentTaskArtifactOutcomeServiceImplTest.java'
        include 'cn/jia/agent/service/impl/AgentTaskFormalDeliveryDecisionServiceImplTest.java'
        include 'cn/jia/agent/conversation/ConversationDeliverableReadAdapterTest.java'
        include 'cn/jia/agent/security/AgentRuntimeSecurityIntegrationTest.java'
    }
    resources.srcDir 'src/test/resources'
    compileClasspath += sourceSets.main.output
    runtimeClasspath += output + compileClasspath
}

configurations.named(v1131RegressionSourceSet.implementationConfigurationName) {
    extendsFrom configurations.testImplementation
}
configurations.named(v1131RegressionSourceSet.runtimeOnlyConfigurationName) {
    extendsFrom configurations.testRuntimeOnly
}

tasks.register('v1131Regression', Test) {
    group = 'verification'
    description = 'Runs the isolated 1.13.1 workspace closed-loop API regression suite.'
    dependsOn tasks.named(v1131RegressionSourceSet.classesTaskName)
    testClassesDirs = v1131RegressionSourceSet.output.classesDirs
    classpath = v1131RegressionSourceSet.runtimeClasspath
    useJUnitPlatform()
}


